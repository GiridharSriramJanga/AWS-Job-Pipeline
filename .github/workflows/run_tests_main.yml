name: Run Tests on PR to Main

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          ALERT_SENDER_MAIL    : ${{ secrets.ALERT_SENDER_MAIL }}
          ALERT_RECEIVER_MAIL  : ${{ secrets.ALERT_RECEIVER_MAIL }}
          GMAIL_APP_PASSWORD   : ${{ secrets.GMAIL_APP_PASSWORD }}
          GROQ_API_KEY         : ${{ secrets.GROQ_API_KEY }}
          AWS_ACCESS_KEY_ID    : ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          pytest tests/ -v --tb=short --cov=pipeline --cov-report=term-missing

      - name: Block merge on test failure
        if: failure()
        run: |
          echo "Tests failed — merge to main is blocked."
          echo "Fix failing tests on dev before opening a new PR."
          exit 1
